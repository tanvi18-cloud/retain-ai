[project]
name = "retain-ai-backend"
version = "0.1.0"
description = "RetainAI backend — agentic customer-retention copilot for retail banking RMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "sqlmodel>=0.0.22,<0.0.23",
    "pydantic-settings>=2.6.0,<3",
    "httpx>=0.28.0,<0.29",
    "crewai>=0.86.0,<1",
    "aiosmtplib>=3.0.0,<4",
    "tenacity>=9.0.0,<10",
    "structlog>=24.4.0,<25",
    "python-multipart>=0.0.12,<0.0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.8.0,<0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
